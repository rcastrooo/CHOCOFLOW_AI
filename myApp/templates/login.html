{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChocoFlow - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #3b1f0a, #7b3f00);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-card h2 {
            color: #7b3f00;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-login {
            background-color: #7b3f00;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        .btn-login:hover {
            background-color: #5a2d00;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🍫 ChocoFlow</h2>
        <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="correo@chocoflow.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="contrasena" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
