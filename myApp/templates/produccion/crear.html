{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChocoFlow - Nueva Producción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar">
        <h4>🍫 ChocoFlow</h4>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'usuarios_lista' %}">👥 Usuarios</a>
        <a href="{% url 'turnos_lista' %}">🕐 Turnos</a>
        <a href="{% url 'producciones_lista' %}" class="active">📦 Producción</a>
        <a href="{% url 'exportaciones_lista' %}">🚚 Exportaciones</a>
        <a href="{% url 'asignaciones_lista' %}">📋 Asignaciones</a>
        <a href="{% url 'reportes_lista' %}">📊 Reportes</a>
        <hr style="border-color: rgba(255,255,255,0.3);">
        <a href="{% url 'logout' %}">🚪 Cerrar Sesión</a>
    </div>

    <div class="flex-grow-1">
        <div class="topbar">
            <h5 class="mb-0">📦 Nueva Orden de Producción</h5>
            <a href="{% url 'producciones_lista' %}" class="btn btn-secondary btn-sm">← Volver</a>
        </div>

        <div class="p-4">
            <div class="card shadow-sm" style="max-width: 700px;">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Producto</label>
                            <input type="text" name="producto" class="form-control" placeholder="Ej: Chocolate amargo 70%" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ingredientes</label>
                            <textarea name="ingredientes" class="form-control" rows="3" placeholder="Lista de ingredientes..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Cantidad Planificada (unidades)</label>
                            <input type="number" name="cantidad_planificada" class="form-control" min="1" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha de Entrega</label>
                                <input type="datetime-local" name="fecha_entrega" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha Límite</label>
                                <input type="datetime-local" name="fecha_limite" class="form-control" required>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-choco">✅ Crear Producción</button>
                            <a href="{% url 'producciones_lista' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
