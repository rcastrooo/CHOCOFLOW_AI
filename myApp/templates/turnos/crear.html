{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChocoFlow - Crear Turno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body>
<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4> ChocoFlow</h4>
        <a href="{% url 'dashboard' %}"> Dashboard</a>
        <a href="{% url 'usuarios_lista' %}"> Usuarios</a>
        <a href="{% url 'turnos_lista' %}">Turnos</a>
        <a href="#"> Producción</a>
        <a href="#"> Exportaciones</a>
        <a href="#"> Reportes</a>
        <hr style="border-color: rgba(255,255,255,0.3);">
        <a href="{% url 'logout' %}"> Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO -->
    <div class="flex-grow-1">
        <div class="topbar">
            <h5 class="mb-0"> Crear Turno</h5>
        </div>

        <div class="p-4">
            <div class="card shadow-sm" style="max-width: 500px;">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" name="fecha" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Horario</label>
                            <select name="horario" class="form-select" required>
                                <option value="">-- Seleccionar --</option>
                                <option value="Mañana">Mañana (6:00am - 2:00pm)</option>
                                <option value="Tarde">Tarde (2:00pm - 10:00pm)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hora de inicio</label>
                            <input type="time" name="hora_inicio" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Hora de fin</label>
                            <input type="time" name="hora_fin" class="form-control" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-choco">Guardar</button>
                            <a href="{% url 'turnos_lista' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
