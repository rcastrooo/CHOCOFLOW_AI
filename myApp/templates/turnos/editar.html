{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChocoFlow - Editar Turno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body>
<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4>🍫 ChocoFlow</h4>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'usuarios_lista' %}">👥 Usuarios</a>
        <a href="{% url 'turnos_lista' %}">🕐 Turnos</a>
        <a href="#">📦 Producción</a>
        <a href="#">🚚 Exportaciones</a>
        <a href="#">📋 Reportes</a>
        <hr style="border-color: rgba(255,255,255,0.3);">
        <a href="{% url 'logout' %}">🚪 Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO -->
    <div class="flex-grow-1">
        <div class="topbar">
            <h5 class="mb-0">✏️ Editar Turno</h5>
        </div>

        <div class="p-4">
            <div class="card shadow-sm" style="max-width: 500px;">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nombre del turno</label>
                            <select name="nombre" class="form-select" required>
                                <option value="Mañana" {% if turno.nombre == 'Mañana' %}selected{% endif %}>Mañana</option>
                                <option value="Tarde" {% if turno.nombre == 'Tarde' %}selected{% endif %}>Tarde</option>
                                <option value="Noche" {% if turno.nombre == 'Noche' %}selected{% endif %}>Noche</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hora de inicio</label>
                            <input type="time" name="hora_inicio" class="form-control" value="{{ turno.hora_inicio }}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Hora de fin</label>
                            <input type="time" name="hora_fin" class="form-control" value="{{ turno.hora_fin }}" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-choco">Guardar cambios</button>
                            <a href="{% url 'turnos_lista' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
