{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChocoFlow - Editar Exportación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar">
        <h4>🍫 ChocoFlow</h4>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'usuarios_lista' %}">👥 Usuarios</a>
        <a href="{% url 'turnos_lista' %}">🕐 Turnos</a>
        <a href="{% url 'producciones_lista' %}">📦 Producción</a>
        <a href="{% url 'exportaciones_lista' %}" class="active">🚚 Exportaciones</a>
        <a href="{% url 'asignaciones_lista' %}">📋 Asignaciones</a>
        <a href="{% url 'reportes_lista' %}">📊 Reportes</a>
        <hr style="border-color: rgba(255,255,255,0.3);">
        <a href="{% url 'logout' %}">🚪 Cerrar Sesión</a>
    </div>

    <div class="flex-grow-1">
        <div class="topbar">
            <h5 class="mb-0">✏️ Editar Exportación</h5>
            <a href="{% url 'exportaciones_lista' %}" class="btn btn-secondary btn-sm">← Volver</a>
        </div>

        <div class="p-4">
            <div class="card shadow-sm" style="max-width: 600px;">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Destino / Empresa</label>
                            <input type="text" name="destino" class="form-control" value="{{ exportacion.destino }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">País</label>
                            <input type="text" name="pais" class="form-control" value="{{ exportacion.pais }}" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha de Envío</label>
                                <input type="date" name="fecha_envio" class="form-control" value="{{ exportacion.fecha_envio|date:'Y-m-d' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha de Entrega</label>
                                <input type="date" name="fecha_entrega" class="form-control" value="{{ exportacion.fecha_entrega|date:'Y-m-d' }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="Pendiente" {% if exportacion.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                                <option value="Enviado" {% if exportacion.estado == 'Enviado' %}selected{% endif %}>Enviado</option>
                                <option value="Entregado" {% if exportacion.estado == 'Entregado' %}selected{% endif %}>Entregado</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-choco">💾 Guardar Cambios</button>
                            <a href="{% url 'exportaciones_lista' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
