{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChocoFlow - Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body>
<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4>ChocoFlow</h4>
        <a href="{% url 'dashboard' %}"> Dashboard</a>
        <a href="{% url 'usuarios_lista' %}"> Usuarios</a>
        <a href="#"> Turnos</a>
        <a href="#"> Producción</a>
        <a href="#"> Exportaciones</a>
        <a href="#"> Reportes</a>
        <a href="#"> IA</a>
        <hr style="border-color: rgba(255,255,255,0.3);">
        <a href="{% url 'logout' %}"> Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO -->
    <div class="flex-grow-1">
        <div class="topbar">
            <h5 class="mb-0"> Editar Usuario</h5>
        </div>

        <div class="p-4">
            <div class="card shadow-sm" style="max-width: 550px;">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select name="rol" class="form-select" required>
                                <option value="Administrador" {% if usuario.rol == 'Administrador' %}selected{% endif %}>Administrador</option>
                                <option value="Supervisor" {% if usuario.rol == 'Supervisor' %}selected{% endif %}>Supervisor</option>
                                <option value="Empleado" {% if usuario.rol == 'Empleado' %}selected{% endif %}>Empleado</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select" required>
                                <option value="Activo" {% if usuario.estado == 'Activo' %}selected{% endif %}>Activo</option>
                                <option value="Inactivo" {% if usuario.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
                                <option value="Incapacitado" {% if usuario.estado == 'Incapacitado' %}selected{% endif %}>Incapacitado</option>
                                <option value="Suspendido" {% if usuario.estado == 'Suspendido' %}selected{% endif %}>Suspendido</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-choco">Guardar cambios</button>
                            <a href="{% url 'usuarios_lista' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
