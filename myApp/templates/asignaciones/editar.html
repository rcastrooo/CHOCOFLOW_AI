{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChocoFlow - Editar Asignación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar">
        <h4>🍫 ChocoFlow</h4>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'usuarios_lista' %}">👥 Usuarios</a>
        <a href="{% url 'turnos_lista' %}">🕐 Turnos</a>
        <a href="{% url 'producciones_lista' %}">📦 Producción</a>
        <a href="{% url 'exportaciones_lista' %}">🚚 Exportaciones</a>
        <a href="{% url 'asignaciones_lista' %}" class="active">📋 Asignaciones</a>
        <a href="{% url 'reportes_lista' %}">📊 Reportes</a>
        <hr style="border-color: rgba(255,255,255,0.3);">
        <a href="{% url 'logout' %}">🚪 Cerrar Sesión</a>
    </div>

    <div class="flex-grow-1">
        <div class="topbar">
            <h5 class="mb-0">✏️ Editar Asignación</h5>
            <a href="{% url 'asignaciones_lista' %}" class="btn btn-secondary btn-sm">← Volver</a>
        </div>

        <div class="p-4">
            <div class="card shadow-sm" style="max-width: 600px;">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Empleado</label>
                            <select name="usuario_id" class="form-select" required>
                                {% for u in usuarios %}
                                <option value="{{ u.id }}" {% if u.id == asignacion.usuario.id %}selected{% endif %}>{{ u.nombre }} ({{ u.rol }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Turno</label>
                            <select name="turno_id" class="form-select" required>
                                {% for t in turnos %}
                                <option value="{{ t.id }}" {% if t.id == asignacion.turno.id %}selected{% endif %}>{{ t.horario }} — {{ t.fecha|date:"d/m/Y" }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tarea</label>
                            <input type="text" name="tarea" class="form-control" value="{{ asignacion.tarea }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Fecha de Asignación</label>
                            <input type="date" name="fecha_asignacion" class="form-control" value="{{ asignacion.fecha_asignacion|date:'Y-m-d' }}" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-choco">💾 Guardar Cambios</button>
                            <a href="{% url 'asignaciones_lista' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
